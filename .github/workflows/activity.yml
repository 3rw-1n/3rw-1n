name: Update contribution graph

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution graph
        run: python scripts/update_activity.py
      - name: Commit changed graph
        run: |
          if ! git diff --quiet -- assets/activity.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/activity.svg
            git commit -m "Update contribution activity graph"
            git push
          fi
